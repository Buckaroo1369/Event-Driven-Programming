<div class="surprise-overlay" id="surpriseOverlay" aria-hidden="true">

    <img src="images/surprise.jpg"
        alt=""
        class="surprise-image">

    <div class="surprise-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="surpriseTitle">

        <p class="surprise-label">A LITTLE SURPRISE</p>

        <h2 id="surpriseTitle">A message for you</h2>

        <p class="surprise-message">
            Thank you for visiting Butter &amp; Crumb!
            We hope our little bakery brings warmth
            and happiness to your day.
        </p>

        <div class="surprise-audio">
            <p>A little tune, just for you</p>
            <span class="audio-indicator">♫</span>
        </div>

        <button type="button"
                class="surprise-ok"
                id="closeSurprise">
            OK
        </button>

        <audio id="surpriseAudio" preload="auto">
            <source src="resources/Lord Huron - The Night We Met (Official Audio) - Lord Huron.mp3" type="audio/mpeg">
        </audio>

    </div>
</div>
